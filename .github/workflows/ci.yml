name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    # Package L runs took 2562-2653 s of the former 2700 s limit and L3 (2487 tests) was
    # cancelled at it; 75 minutes leaves room for the remaining slices.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: api
    env:
      # Throwaway credentials for a CI-only container; not a secret.
      GBA_TEST_ADMIN_DSN: postgresql://gba_superuser:ci-only-not-a-secret@127.0.0.1:55432/postgres
      # Missing PostgreSQL must fail CI, never skip the integration tests.
      GBA_REQUIRE_POSTGRES: "1"
      GBA_REQUIRE_BROWSER: "1"
      # The production image is built and run for real (jobs, API, booking, shutdown).
      GBA_REQUIRE_CONTAINER: "1"
      GBA_CONTAINER_IMAGE: gorgona-api:ci
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.14
      - run: uv sync --locked

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and check customer web
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:unit
          npm run build
          npx playwright install --with-deps chromium

      - name: Start PostgreSQL 18
        run: |
          docker run -d --name gba-postgres \
            -e POSTGRES_USER=gba_superuser \
            -e POSTGRES_PASSWORD=ci-only-not-a-secret \
            -p 127.0.0.1:55432:5432 \
            postgres:18 -c max_connections=250
          for _ in $(seq 1 60); do
            docker exec gba-postgres pg_isready -h 127.0.0.1 -U gba_superuser && break
            sleep 1
          done
          docker exec gba-postgres psql -h 127.0.0.1 -U gba_superuser -tAc "select version()"

      - name: Build the production image
        working-directory: .
        run: docker build --pull -t gorgona-api:ci .

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --junitxml=pytest-results.xml

      # Log text needs a GitHub sign-in; annotations do not. Name what failed.
      - name: Name the failed tests
        if: failure()
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("pytest-results.xml")
          if not report.exists():
              raise SystemExit(0)
          source = report.read_text(encoding="utf-8")
          # This job's own pytest report. Refuse any document type or entity declaration.
          if "<!DOCTYPE" in source or "<!ENTITY" in source:
              raise SystemExit(0)
          shown = 0
          for case in ElementTree.fromstring(source).iter("testcase"):
              for found in [*case.findall("failure"), *case.findall("error")]:
                  text = (found.get("message") or "") + "\n" + (found.text or "")
                  # A browser failure says what it expected; otherwise take the first error.
                  at = text.find("Error: expect")
                  at = text.find("Error:") if at < 0 else at
                  excerpt = text[max(at - 250, 0) :][:1700]
                  excerpt = re.sub(r"eyJ[\w-]{10,}\.[\w-]+\.[\w-]+", "<token>", excerpt)
                  excerpt = re.sub(r"postgres(?:ql)?://\S+", "<dsn>", excerpt)
                  excerpt = excerpt.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  name = f"{case.get('classname')} {case.get('name')}"
                  name = name.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
                  print(f"::error title={name}::{excerpt}")
                  shown += 1
                  if shown == 10:
                      raise SystemExit(0)
          PY
